<section class="app-section-card">
  <div class="mb-6">
    <h2 class="text-2xl font-semibold text-slate-900">Configuración del sistema</h2>
    <p class="text-sm text-slate-500">Administrá tus preferencias y módulos visibles.</p>
  </div>

  <div class="mb-6 flex items-center gap-4">
    <img [src]="profilePhotoPreview" alt="Foto perfil" class="h-16 w-16 rounded-2xl border border-slate-200 bg-white object-cover" />
    <div>
      <p class="text-sm text-slate-500">Perfil</p>
      <p class="text-base font-semibold text-slate-900">{{ settings.nombre || 'Usuario' }}</p>
      <label class="mt-2 inline-flex cursor-pointer text-xs font-semibold text-sky-700 hover:underline">
        Cambiar foto
        <input type="file" accept="image/*" class="hidden" (change)="onPhotoSelected($event)" />
      </label>
      <p *ngIf="selectedPhotoName" class="mt-1 text-xs text-slate-500">Seleccionada: {{ selectedPhotoName }}</p>
    </div>
  </div>

  <div class="grid gap-4 md:grid-cols-2">
    <div>
      <label class="app-field-label">Nombre</label>
      <input [(ngModel)]="settings.nombre" class="app-input" />
    </div>
    <div>
      <label class="app-field-label">Correo</label>
      <input [value]="settings.correo" class="app-input" disabled />
    </div>
  </div>

  <div class="mt-6 space-y-4">
    <label class="settings-toggle-row">
      <span>Color del sistema (recordatorio)</span>
      <input type="color" [(ngModel)]="accentColor" title="No funcional por ahora" />
    </label>

    <label class="settings-toggle-row">
      <span>Modo oscuro</span>
      <button type="button" class="switch-pill" [class.on]="settings.darkMode" (click)="toggleSetting('darkMode')">
        <span class="switch-knob"></span>
        <span class="switch-text">{{ settings.darkMode ? 'ON' : 'OFF' }}</span>
      </button>
    </label>

    <label class="settings-toggle-row">
      <span>Tiene vehículo</span>
      <button type="button" class="switch-pill" [class.on]="settings.showVehicle" (click)="toggleSetting('showVehicle')"><span class="switch-knob"></span><span class="switch-text">{{ settings.showVehicle ? 'ON' : 'OFF' }}</span></button>
    </label>

    <label class="settings-toggle-row">
      <span>Mostrar deudores</span>
      <button type="button" class="switch-pill" [class.on]="settings.showLoans" (click)="toggleSetting('showLoans')"><span class="switch-knob"></span><span class="switch-text">{{ settings.showLoans ? 'ON' : 'OFF' }}</span></button>
    </label>

    <label class="settings-toggle-row">
      <span>Mostrar deudas</span>
      <button type="button" class="switch-pill" [class.on]="settings.showDebts" (click)="toggleSetting('showDebts')"><span class="switch-knob"></span><span class="switch-text">{{ settings.showDebts ? 'ON' : 'OFF' }}</span></button>
    </label>
  </div>

  <div class="mt-8 flex justify-end">
    <button class="app-primary-button" (click)="save()">Guardar configuración</button>
  </div>
</section>
