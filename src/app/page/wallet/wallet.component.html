<app-financial-status-badge [label]="estadoFinanciero" [color]="estadoFinancieroColor" />

<!-- Encabezado -->
<div class="app-page-toolbar animate-fadeSlideDown" style="animation-delay:0.1s">
  <h6 class="text-lg font-semibold text-gray-800">Mi Billetera</h6>
  <button (click)="openModal()" class="app-link-button app-link-button-primary">
    Agregar +
  </button>
</div>

<!-- Total general -->
<div class="mt-6 text-right font-semibold text-gray-700 animate-fadeSlideDown" style="animation-delay:0.2s">
  Total general: ${{ formatCurrency(getTotalWallet()) }}
</div>

<!-- Contenedor de tarjetas -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
  <div *ngFor="let account of wallet" class="app-card
              transform opacity-0 animate-fadeIn" [style.animationDelay]="getAnimationDelay(account)">

    <!-- Encabezado -->
    <div class="app-card-header">
      <h3 class="text-sm font-bold text-gray-800">{{ account.tipo }}</h3> <!-- Nombre en bold -->

      <!-- Menú de acciones -->
      <div class="relative">
        <!-- Botón principal -->
        <button (click)="toggleMenu(account)"
          class="text-gray-600 hover:text-gray-800 p-2 rounded-full hover:bg-gray-100" type="button">
          <span class="material-icons">more_vert</span>
        </button>

        <!-- Menú desplegable -->
        <div *ngIf="account.showMenu" class="app-menu-panel">
          <button (click)="openAddModal(account.id); account.showMenu = false"
            class="app-menu-item" type="button">
            Operar
          </button>
          <button (click)="openEditModal(account.id); account.showMenu = false"
            class="app-menu-item" type="button">
            Editar
          </button>
          <button (click)="openEmptyModal(account.id); account.showMenu = false"
            class="app-menu-item" type="button">
            Vaciar
          </button>
          <button (click)="openDeleteModal(account.id); account.showMenu = false"
            class="app-menu-item text-red-600" type="button">
            Eliminar
          </button>
        </div>
      </div>
    </div>

    <!-- Contenido -->
    <div class="p-5 text-center">
      <p class="text-gray-500 text-xs mb-1">Saldo</p> <!-- Texto más pequeño -->
      <p class="text-xl font-semibold text-gray-800">$ {{ formatCurrency(account.valor) }}</p>
      <!-- Semi-bold y tamaño medio -->
    </div>

    <!-- Pie de tarjeta -->
    <div class="app-card-footer">
      <button (click)="openTransactionModal(account.id)"
        class="app-accent-button disabled:opacity-50 disabled:cursor-not-allowed">
        Mover
      </button>
    </div>
  </div>
</div>

<!-- Modal para agregar cuenta -->
<app-modal-shell *ngIf="isModalOpen" title="Agregar Nueva Cuenta"
  description="Introduce los detalles de la nueva cuenta.">

    <label class="app-field-label">Dinero en:</label>
    <input type="text" [(ngModel)]="newAccount.tipo" placeholder="Ej: Cuenta de ahorros"
      class="app-input mb-3" />

    <label class="app-field-label">Valor:</label>
    <input type="text" [value]="formatCurrency(newAccount.valor)" (input)="onValueInput($event, 'new')"
      placeholder="Ej: 1.000.000" class="app-input mb-3" />

    <div class="flex justify-end gap-2">
      <button (click)="closeModal()" class="app-secondary-button">Cancelar</button>
      <button (click)="addAccount()" class="app-primary-button">Agregar</button>
    </div>
</app-modal-shell>

<!-- Modal para agregar valor a cuenta -->
<app-modal-shell *ngIf="isAddValueModalOpen" title="Agregar o Restar Valor"
  description="Introduce un valor para adicionar o restar a esta cuenta." size="sm">

    <label class="app-field-label-strong">Valor:</label>
    <input type="text" [value]="formatCurrency(newValue)" (input)="onValueInput($event, 'add')" placeholder="Ej: 5000"
      class="app-input mb-4" />

    <div class="flex justify-end gap-2">
      <button (click)="closeAddValueModal()" class="app-secondary-button">Cancelar</button>
      <button (click)="applyValue('subtract')" class="app-primary-button">Restar</button>
      <button (click)="applyValue('add')" class="app-success-button">Sumar</button>
    </div>
</app-modal-shell>

<!-- Modal para editar cuenta -->
<app-modal-shell *ngIf="isEditModalOpen" title="Editar Cuenta"
  description="Edita los detalles de la cuenta.">

    <label class="app-field-label">Dinero en:</label>
    <input type="text" [(ngModel)]="editedAccount.tipo" placeholder="Ej: Efectivo"
      class="app-input mb-3" />

    <label class="app-field-label">Valor:</label>
    <input type="text" [value]="formatCurrency(editedAccount.valor)" (input)="onEditValueInput($event)"
      placeholder="Ej: 750.000" class="app-input mb-3" />

    <div class="flex justify-end gap-2">
      <button (click)="closeEditModal()" class="app-secondary-button">Cancelar</button>
      <button (click)="saveEditedAccount()" class="app-primary-button">Guardar</button>
    </div>
</app-modal-shell>

<!-- Modal para vaciar cuenta -->
<app-confirm-modal *ngIf="isEmptyModalOpen" title="¿Vaciar Cuenta?"
  message="¿Estás seguro de que deseas vaciar esta billetera? Si lo haces, el dinero registrado se igualará a $0."
  confirmText="Aceptar" tone="warning" icon="warning_amber" (cancel)="closeEmptyModal()"
  (confirm)="confirmEmptyAccount()" />

<!-- Modal para eliminar cuenta -->
<app-confirm-modal *ngIf="isDeleteModalOpen" title="¿Eliminar Cuenta?"
  message="¿Estás seguro de que deseas eliminar esta cuenta? Esta acción no se puede deshacer."
  confirmText="Eliminar" tone="danger" icon="report_problem" (cancel)="closeDeleteModal()"
  (confirm)="confirmDeleteAccount()" />

<!-- Modal de Transacción -->
<app-modal-shell *ngIf="isTransactionModalOpen" title="Mover Dinero"
  panelClass="animate-pop-in">
    <p class="text-gray-600 mb-4 text-sm">Cuenta origen: <strong>{{ sourceWallet?.tipo }}</strong></p>

    <!-- Cuenta Destino -->
    <label class="block mb-2 font-medium">Hacia:</label>
    <select [(ngModel)]="selectedWallet" class="app-input mb-4">
      <option value="" disabled selected>Selecciona cuenta destino</option>
      <option *ngFor="let account of wallet" [value]="account.id" [disabled]="account.id === sourceWalletId">
        {{ account.tipo }}
      </option>
    </select>

    <!-- Valor a transferir -->
    <label class="block mb-2 font-medium">Valor a asignar:</label>
    <input type="text" [value]="formatCurrency(assignedValue || 0)" (input)="onAssignedValueInput($event)"
      placeholder="Ej: 50,000" class="app-input mb-1" />


    <p class="text-xs text-gray-500 mb-4">
      Valor mínimo $0, máximo ${{ formatCurrency(sourceWallet?.valor || 0) }}
    </p>

    <!-- Botones -->
    <div class="flex justify-end gap-2">
      <button (click)="closeTransactionModal()" class="app-secondary-button bg-white">
        Cancelar
      </button>
      <button (click)="confirmTransaction()" class="app-primary-button hover:bg-sky-800">
        Aceptar
      </button>
    </div>
</app-modal-shell>
