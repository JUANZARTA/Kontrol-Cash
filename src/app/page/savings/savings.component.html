<app-financial-status-badge [label]="estadoFinanciero" [color]="estadoFinancieroColor" />

<!-- Encabezado con botón -->
<div class="app-page-toolbar opacity-0 animate-fadeSlideDown" style="animation-delay:0.1s">
  <div>
    <h6 class="text-lg font-semibold text-white">Mis Ahorros</h6>
    <p class="text-sm flex items-center gap-2 opacity-90">
      <strong>Estado Actual</strong>
    </p>
  </div>
  <button (click)="openModal()" class="app-primary-button shadow-md hover:bg-teal-500">
    Agregar Ahorro +
  </button>
</div>

<!-- Tabla de Ahorros -->
<div class="overflow-x-auto">
  <table class="app-table">
    <thead class="app-table-head">
      <tr>
        <th class="text-left py-2 px-3 sm:px-4">Ahorro en</th>
        <th class="text-right py-2 px-3 sm:px-4">Valor</th>
        <th class="text-center py-2 px-3 sm:px-4">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let account of savings; let i = index"
        class="app-table-row opacity-0 animate-fadeSlideDown"
        [style.animationDelay]="getRowAnimationDelay(account, i)">
        <td class="py-2 px-3 sm:px-4 font-semibold">{{ account.tipo }}</td>
        <td class="py-2 px-3 sm:px-4 text-right font-semibold text-teal-700">
          ${{ formatCurrency(account.valor) }}
        </td>
        <td class="py-2 px-3 sm:px-4 text-center">
          <button (click)="openAddModal(account.id)" class="text-lime-600 mr-2">
            <span class="material-icons">add</span>
          </button>
          <button (click)="openEditModal(account.id)" class="text-sky-700 mr-2">
            <mat-icon>edit</mat-icon>
          </button>
          <button (click)="openDeleteModal(account.id)" class="text-orange-600">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </tr>

      <!-- Total Final -->
      <tr class="app-table-total-positive opacity-0 animate-fadeSlideDown"
        [style.animationDelay]="getRowAnimationDelay('total', savings.length)">
        <td class="py-3 px-3 sm:px-4 text-left">Total</td>
        <td class="py-3 px-3 sm:px-4 text-right">
          ${{ formatCurrency(getTotalSavings()) }}
        </td>
        <td></td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Modal para agregar ahorro -->
<app-modal-shell *ngIf="isModalOpen" title="Agregar Nuevo Ahorro"
  description="Introduce los detalles del nuevo ahorro." panelClass="animate-pop-in">

    <label class="app-field-label animate-fadeIn">Ahorro en:</label>
    <input type="text" [(ngModel)]="newSaving.tipo" placeholder="Ej: Cuenta bancaria"
      class="app-input mb-3 animate-fadeIn">

    <label class="app-field-label animate-fadeIn">Valor:</label>
    <input type="text" [value]="formatCurrency(newSaving.valor)" (input)="onValueInput($event, 'new')"
      placeholder="Ej: 500.000" class="app-input mb-3 animate-fadeIn">

    <div class="flex justify-end gap-2">
      <button (click)="closeModal()" class="app-secondary-button animate-fadeIn">
        Cancelar
      </button>
      <button (click)="addSaving()" class="app-primary-button animate-fadeIn">
        Agregar
      </button>
    </div>
</app-modal-shell>

<!-- Modal para agregar valor al ahorro -->
<app-modal-shell *ngIf="isAddValueModalOpen" title="Agregar o Restar Valor"
  description="Introduce un valor para adicionar o restar a este ahorro." size="sm" panelClass="animate-pop-in">

    <label class="app-field-label-strong animate-fadeIn">Valor:</label>
    <input type="text" [value]="formatCurrency(newValue)" (input)="onValueInput($event, 'add')" placeholder="Ej: 3000"
      class="app-input mb-4 animate-fadeIn">

    <div class="flex justify-end gap-2">
      <button (click)="closeAddValueModal()" class="app-secondary-button animate-fadeIn">
        Cancelar
      </button>
      <button (click)="applyValue('subtract')" class="app-primary-button animate-fadeIn">
        Restar
      </button>
      <button (click)="applyValue('add')" class="app-success-button animate-fadeIn">
        Sumar
      </button>
    </div>
</app-modal-shell>

<!-- Modal para editar ahorro -->
<app-modal-shell *ngIf="isEditModalOpen" title="Editar Ahorro"
  description="Edita los detalles del ahorro." panelClass="animate-pop-in">

    <label class="app-field-label animate-fadeIn">Ahorro en:</label>
    <input type="text" [(ngModel)]="editedSaving.tipo" placeholder="Ej: Inversión CDT"
      class="app-input mb-3 animate-fadeIn">

    <label class="app-field-label animate-fadeIn">Valor:</label>
    <input type="text" [value]="formatCurrency(editedSaving.valor)" (input)="onEditValueInput($event)"
      placeholder="Ej: 1.000.000" class="app-input mb-3 animate-fadeIn">

    <div class="flex justify-end gap-2">
      <button (click)="closeEditModal()" class="app-secondary-button animate-fadeIn">
        Cancelar
      </button>
      <button (click)="saveEditedSaving()" class="app-primary-button animate-fadeIn">
        Guardar
      </button>
    </div>
</app-modal-shell>

<!-- Modal para eliminar ahorro -->
<app-confirm-modal *ngIf="isDeleteModalOpen" title="¿Eliminar Ahorro?"
  message="¿Estás seguro de que deseas eliminar este ahorro? Esta acción no se puede deshacer."
  confirmText="Eliminar" tone="danger" icon="report_problem" (cancel)="closeDeleteModal()"
  (confirm)="confirmDeleteSaving()" />
