<!-- BOTÓN DE MENÚ HAMBURGUESA (MÓVILES) -->
<button *ngIf="isMobile()" (click)="toggleSidebar()"
  class="fixed left-4 top-4 z-50 rounded-2xl border border-white/10 bg-slate-900/90 p-3 text-white shadow-xl backdrop-blur-md transition-colors hover:bg-slate-800 xl:hidden">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
    class="w-6 h-6">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7" />
  </svg>
</button>

<!-- BACKDROP (mobile): cerrar al tocar fuera del sidebar -->
<div *ngIf="isSidebarOpen && isMobile()"
  (click)="closeSidebar()"
  class="fixed inset-0 z-40 bg-black/40 backdrop-blur-sm lg:hidden">
</div>

<!-- SIDEBAR -->
<aside [class.translate-x-[-100%]]="!isSidebarOpen && isMobile()"
  class="fixed left-0 top-0 z-50 h-full w-72 overflow-hidden rounded-r-[2rem] border-r border-white/10 bg-gradient-to-b from-slate-950 via-slate-900 to-sky-950 shadow-2xl transform transition-transform duration-300 ease-in-out">
  <!-- CONTENEDOR SCROLLABLE -->
  <div class="h-full overflow-y-auto scrollbar-hide">
    <!-- aquí va TODO el contenido actual del sidebar:
       header, menú principal y cuenta -->

    <!-- CÍRCULOS ANIMADOS DE FONDO -->
    <div class="circle animate-floating"
      style="top:10%; left:20%; width:80px; height:80px; background: rgba(255,255,255,0.15);"></div>
    <div class="circle animate-floating-slow"
      style="top:50%; left:60%; width:100px; height:100px; background: rgba(255,255,255,0.1);"></div>
    <div class="circle animate-floating-fast"
      style="top:70%; left:30%; width:60px; height:60px; background: rgba(255,255,255,0.2);"></div>
    <div class="circle animate-floating-slower"
      style="top:20%; left:75%; width:90px; height:90px; background: rgba(255,255,255,0.12);"></div>

    <!-- HEADER -->
    <div class="relative z-10 border-b border-white/10 px-6 py-6 text-white">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p class="text-xs uppercase tracking-[0.25em] text-sky-200/70">Mi Cartera</p>
          <h6 class="mt-2 text-xl font-semibold tracking-tight">Panel financiero</h6>
        </div>
      <button *ngIf="isMobile()" (click)="toggleSidebar()"
        class="rounded-full bg-white/10 p-2 transition hover:bg-white/20">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
          class="w-5 h-5 text-white">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      </div>
    </div>

    <!-- MENÚ PRINCIPAL -->
    <nav class="relative z-10 mt-5 flex flex-col gap-2 px-4">
      <a routerLink="/app/home" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active" [routerLinkActiveOptions]="{ exact: true }"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.1s">
        <span class="material-icons text-[20px] text-sky-300">home</span>
        Inicio
      </a>

      <hr class="border-white/10 mx-2 opacity-0 animate-fadeSlideLeft" style="animation-delay:0.12s" />

      <!-- Tabla de Ingresos -->
      <a routerLink="/app/income" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.15s">
        <span class="material-icons text-[20px] text-teal-400">add_circle</span>
        Tabla de Ingresos
      </a>

      <!-- Tabla de Gastos -->
      <a routerLink="/app/expense" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.2s">
        <span class="material-icons text-[20px] text-orange-400">remove_circle</span>
        Tabla de Gastos
      </a>

      <!-- Tabla Facturas -->
      <a routerLink="/app/invoice" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.25s">
        <span class="material-icons text-[20px] text-sky-400">receipt_long</span>
        Facturas
      </a>

      <hr class="border-white/10 mx-2 opacity-0 animate-fadeSlideLeft" style="animation-delay:0.27s" />

      <!-- Mi Billetera -->
      <a routerLink="/app/wallet" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.3s">
        <span class="material-icons text-[20px] text-indigo-400">account_balance_wallet</span>
        Mi Billetera
      </a>

      <!-- Alcancías -->
      <a routerLink="/app/saving" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.35s">
        <span class="material-icons text-[20px] text-emerald-400">savings</span>
        Alcancías
      </a>

      <hr class="border-white/10 mx-2 opacity-0 animate-fadeSlideLeft" style="animation-delay:0.37s" />

      <!-- Deudas -->
      <a routerLink="/app/debt" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.4s" *ngIf="showDebts">
        <span class="material-icons text-[20px] text-rose-400">credit_score</span>
        Deudas
      </a>

      <!-- Deudores -->
      <a routerLink="/app/loan" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.45s" *ngIf="showLoans">
        <span class="material-icons text-[20px] text-purple-400">people</span>
        Deudores
      </a>

      <hr class="border-white/10 mx-2 opacity-0 animate-fadeSlideLeft" style="animation-delay:0.47s" />

      <!-- Mi Vehículo -->
      <a routerLink="/app/vehicle" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.48s" *ngIf="showVehicle">
        <span class="material-icons text-[20px] text-slate-400">directions_car</span>
        Mi Vehículo
      </a>

      <!-- Estadísticas -->
      <a routerLink="/app/statistics" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.49s" *ngIf="showStatistics">
        <span class="material-icons text-[20px] text-cyan-400">bar_chart</span>
        Estadísticas
      </a>

      <hr class="border-white/10 mx-2 opacity-0 animate-fadeSlideLeft" style="animation-delay:0.495s" />

      <a routerLink="/app/settings" (click)="closeSidebar()"
        routerLinkActive="app-sidebar-link-active"
        class="app-sidebar-link opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.5s">
        <span class="material-icons text-[20px] text-gray-400">settings</span>
        Configuración
      </a>

    </nav>

    <!-- CUENTA -->
    <div class="relative z-10 mt-8 px-4 pb-6">
      <div class="rounded-3xl border border-white/10 bg-white/5 p-4 backdrop-blur-sm">
      <p class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-sky-100/70">Cuenta</p>
      <button (click)="logout()"
        class="flex w-full items-center justify-center gap-2 rounded-2xl bg-white/8 px-4 py-3 text-sm font-semibold text-white transition hover:bg-red-500/30 opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.5s">
        <span class="material-icons text-[18px]">logout</span>
        Salir
      </button>
      </div>
    </div>

  </div>
</aside>
