<!-- BOTÓN DE MENÚ HAMBURGUESA (MÓVILES) -->
<button *ngIf="isMobile()" (click)="toggleSidebar()"
  class="fixed top-4 left-4 z-50 bg-sky-600 text-white p-2 rounded-lg shadow-lg hover:bg-sky-700 transition-colors xl:hidden">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
    class="w-6 h-6">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7" />
  </svg>
</button>

<!-- SIDEBAR -->
<aside [class.translate-x-[-100%]]="!isSidebarOpen && isMobile()"
  class="bg-gradient-to-b from-sky-700 to-sky-500 fixed top-0 left-0 z-50 h-full w-72 overflow-hidden shadow-2xl rounded-r-2xl transform transition-transform duration-300 ease-in-out">
  <!-- CONTENEDOR SCROLLABLE -->
  <div class="h-full overflow-y-auto scrollbar-hide">
    <!-- aquí va TODO el contenido actual del sidebar:
       header, menú principal y cuenta -->

    <!-- CÍRCULOS ANIMADOS DE FONDO -->
    <div class="circle animate-floating"
      style="top:10%; left:20%; width:80px; height:80px; background: rgba(255,255,255,0.15);"></div>
    <div class="circle animate-floating-slow"
      style="top:50%; left:60%; width:100px; height:100px; background: rgba(255,255,255,0.1);"></div>
    <div class="circle animate-floating-fast"
      style="top:70%; left:30%; width:60px; height:60px; background: rgba(255,255,255,0.2);"></div>
    <div class="circle animate-floating-slower"
      style="top:20%; left:75%; width:90px; height:90px; background: rgba(255,255,255,0.12);"></div>

    <!-- HEADER -->
    <div class="relative z-10 flex items-center justify-between p-6 border-b border-gray-200 text-white">
      <h6 class="text-lg font-bold">Mi Cartera</h6>
      <button *ngIf="isMobile()" (click)="toggleSidebar()"
        class="p-2 rounded-full bg-white/20 hover:bg-white/30 transition">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
          class="w-5 h-5 text-white">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- MENÚ PRINCIPAL -->
    <nav class="relative z-10 mt-4 px-4 flex flex-col gap-2">
      <a routerLink="/app/home" (click)="closeSidebar()"
        class="flex items-center gap-3 p-3 rounded-lg font-medium text-white hover:bg-white/20 transition opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.1s">
        <!-- icono svg -->
        Inicio
      </a>

      <!-- Tabla de Ingresos -->
      <a routerLink="/app/income" (click)="closeSidebar()"
        class="flex items-center gap-3 p-3 rounded-lg font-medium text-white hover:bg-sky-50 hover:text-sky-700 transition opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.2s">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-5 h-5">
          <path
            d="M12 2.25a9.75 9.75 0 100 19.5 9.75 9.75 0 000-19.5zM7.5 12a4.5 4.5 0 019 0 4.5 4.5 0 01-9 0zM12 9a3 3 0 110 6 3 3 0 010-6z" />
        </svg>
        Tabla de Ingresos
      </a>

      <!-- Mi Cartera -->
      <a routerLink="/app/wallet" (click)="closeSidebar()"
        class="flex items-center gap-3 p-3 rounded-lg font-medium text-white hover:bg-sky-50 hover:text-sky-700 transition opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.25s">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-5 h-5">
          <path
            d="M4.5 5.25a2.25 2.25 0 012.25-2.25h10.5A2.25 2.25 0 0119.5 5.25v2.25H4.5V5.25zM3 9.75a.75.75 0 01.75-.75h16.5a.75.75 0 01.75.75V18a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 18V9.75z" />
        </svg>
        Mi Billetera
      </a>

      <!-- Tabla Facturas -->
      <a routerLink="/app/invoice" (click)="closeSidebar()"
        class="flex items-center gap-3 p-3 rounded-lg font-medium text-white hover:bg-sky-50 hover:text-sky-700 transition opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.3s">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-5 h-5">
          <path d="M5 4h14v2H5V4zm0 4h14v2H5V8zm0 4h14v2H5v-2zm0 4h14v2H5v-2z" />
        </svg>
        Facturas
      </a>

      <!-- Tabla de Gastos -->
      <a routerLink="/app/expense" (click)="closeSidebar()"
        class="flex items-center gap-3 p-3 rounded-lg font-medium text-white hover:bg-sky-50 hover:text-sky-700 transition opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.15s">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-5 h-5">
          <path
            d="M5 3a1 1 0 000 2h14a1 1 0 100-2H5zM3 7h18v12H3V7zm2 2v8h14V9H5zm5 1a1 1 0 011 1v4a1 1 0 01-2 0v-4a1 1 0 011-1zm6 0a1 1 0 011 1v4a1 1 0 01-2 0v-4a1 1 0 011-1z" />
        </svg>
        Tabla de Gastos
      </a>
      <br>

      <!-- Mis Ahorros -->
      <a routerLink="/app/saving" (click)="closeSidebar()"
        class="flex items-center gap-3 p-3 rounded-lg font-medium text-white hover:bg-sky-50 hover:text-sky-700 transition opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.35s">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-5 h-5">
          <path
            d="M12 2.25a9.75 9.75 0 100 19.5 9.75 9.75 0 000-19.5zM6 10.5h12a.75.75 0 010 1.5H6a.75.75 0 010-1.5zM7.5 15h9a.75.75 0 010 1.5h-9a.75.75 0 010-1.5z" />
        </svg>
        Mis Ahorros
      </a>

      <!-- Préstamos -->
      <a routerLink="/app/loan" (click)="closeSidebar()"
        class="flex items-center gap-3 p-3 rounded-lg font-medium text-white hover:bg-sky-50 hover:text-sky-700 transition opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.4s">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-5 h-5">
          <path
            d="M3 5h18a2 2 0 012 2v10a2 2 0 01-2 2H3a2 2 0 01-2-2V7a2 2 0 012-2zm0 2v2h18V7H3zm0 4v6h18v-6H3zm2 2h2v2H5v-2z" />
        </svg>
        Deudores
      </a>

      <!-- Deudas -->
      <a routerLink="/app/debt" (click)="closeSidebar()"
        class="flex items-center gap-3 p-3 rounded-lg font-medium text-white hover:bg-sky-50 hover:text-sky-700 transition opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.45s">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-5 h-5">
          <path
            d="M2.25 12a9.75 9.75 0 1019.5 0 9.75 9.75 0 00-19.5 0zM13.5 9.75a.75.75 0 00-1.5 0V12H9.75a.75.75 0 000 1.5H12v2.25a.75.75 0 001.5 0V13.5h2.25a.75.75 0 000-1.5H13.5V9.75z" />
        </svg>
        Deudas
      </a>

    </nav>

    <!-- CUENTA -->
    <div class="relative z-10 mt-6 px-4">
      <p class="text-sm font-bold text-white uppercase mb-2">Cuenta</p>
      <button (click)="logout()"
        class="flex items-center gap-3 p-3 w-full rounded-lg text-white hover:bg-red-500/30 transition font-medium opacity-0 animate-fadeSlideLeft"
        style="animation-delay:0.5s">
        Salir
      </button>
    </div>

  </div>
</aside>
