<div class="app-shell">
  <app-sidebar />

  <div class="app-main">
    <div class="app-content">
      <app-header />

      <div *ngIf="pendingClose" class="app-section-card mt-4 flex items-center justify-between flex-wrap gap-3" style="border-color: rgba(220, 38, 38, 0.4);">
        <div class="flex items-center gap-3">
          <span class="material-icons text-red-600">lock_clock</span>
          <p class="text-sm" style="color: var(--app-text)">
            Tenés <strong class="capitalize">{{ pendingClosePeriodLabel }}</strong> sin cerrar. Cerralo para poder seguir registrando datos.
          </p>
        </div>
        <button (click)="goToMonthClose()" class="app-warning-button text-xs">Cerrar mes ahora</button>
      </div>

      <main class="mt-8">
        <router-outlet />
      </main>

      <div class="mt-8">
        <app-footer />
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="connection.offline()"
  class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 px-4 py-2 rounded-full text-xs whitespace-nowrap"
  style="background-color: var(--app-surface); border: 1px solid var(--app-border); color: var(--app-muted); box-shadow: var(--app-shadow);"
  role="status"
>
  <span class="material-icons text-base text-red-500">cloud_off</span>
  Sin conexión · tus cambios se guardan al volver
</div>
