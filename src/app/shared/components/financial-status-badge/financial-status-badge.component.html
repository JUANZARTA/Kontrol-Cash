<div class="px-6 py-4 border-b flex center-end animate-fadeSlideDown">
  <span
    [ngClass]="{
      'bg-orange-600': color === 'rojo',
      'bg-sky-600': color === 'azul',
      'bg-teal-600': color === 'verde'
    }"
    class="text-white text-sm font-semibold px-4 py-2 rounded-full shadow-md"
  >
    {{ label }}
  </span>
</div>
