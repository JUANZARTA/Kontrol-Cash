<div
  class="flex flex-col md:flex-row md:justify-between md:items-center gap-6 p-4 bg-white/70 backdrop-blur-sm rounded-xl shadow-sm animate-fadeSlideDown">

  <!-- 🧾 Columna izquierda: logo + texto -->
  <div class="capitalize flex-1 flex items-center gap-3">
    <img src="assets/img/logoIcono.png" alt="Mi Cartera Logo"
      class="h-16 w-16 md:h-20 md:w-20 transition-transform duration-500 hover:scale-105 hover:rotate-1" />

    <div>
      <!-- Fecha actual -->
      <p class="text-sm font-semibold text-gray-600 mb-1 animate-fadeIn">
        📅 Fecha actual: <span class="text-sky-700">{{ currentYear }}/{{ currentMonth }}</span>
      </p>

      <!-- Ruta -->
      <h6 class="tracking-normal text-base font-semibold leading-relaxed text-gray-900 animate-fadeIn">
        {{ currentRoute || 'Maneja tu Dinero con Confianza' }}
      </h6>
    </div>
  </div>

  <!-- 🎛 Columna derecha: acciones -->
  <div class="flex flex-wrap justify-end gap-3 items-center w-full md:w-auto animate-fadeIn">

    <button (click)="toggleTheme()"
      class="flex items-center gap-2 bg-white/80 text-gray-700 px-4 py-2 rounded-lg shadow-md hover:bg-sky-100 active:scale-95 transition-all duration-300 border border-gray-200">
      <span class="material-icons text-sm">{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</span>
      <span>{{ isDarkMode ? 'Modo claro' : 'Modo oscuro' }}</span>
    </button>

     <!-- 📅 Botón mes -->
    <button (click)="openMonthModal()"
      class="flex items-center gap-2 bg-gradient-to-r from-sky-500 to-blue-600 text-white px-4 py-2 rounded-lg shadow-md hover:from-sky-600 hover:to-blue-700 active:scale-95 transition-all duration-300">
      <span class="material-icons text-sm animate-pulse">calendar_month</span>
      <span>Cambiar Mes</span>
    </button>

    <!-- 🔒 Cerrar sesión -->
    <button (click)="logout()"
      class="flex items-center gap-1 bg-slate-500 text-white px-4 py-2 rounded-lg shadow-md hover:bg-slate-600 active:scale-95 transition-all duration-300">
      <span class="material-icons text-sm">logout</span>
      <span>Salir</span>
    </button>

  </div>
</div>


<!-- 🌐 Modal: Cambiar mes -->
<app-modal-shell *ngIf="showMonthModal" [modalId]="'month-modal'"
  panelClass="rounded-2xl max-h-[90vh] overflow-y-auto transform transition-all duration-300 animate-scaleIn">
    <h2 class="text-lg font-bold mb-4 text-center text-sky-700 tracking-wide">
      {{ !selectedYear ? 'Selecciona un Año' : 'Selecciona un Mes' }}
    </h2>

    <!-- 📅 Años -->
    <div *ngIf="!selectedYear"
      class="max-h-60 overflow-y-auto mb-4 px-1 py-2 border border-gray-200 rounded-md space-y-2 scrollbar-hide">
      <button *ngFor="let year of years; let i = index" (click)="selectYear(year)"
        class="w-full px-4 py-2 rounded-lg bg-gray-100 hover:bg-sky-500 text-gray-800 hover:text-white transition-all duration-300 animate-fadeSlideUp">
        {{ year }}
      </button>
    </div>

    <!-- 🗓 Meses -->
    <div *ngIf="selectedYear" class="animate-fadeSlideUp">
      <div class="flex justify-center mb-4">
        <button (click)="clearYearSelection()"
          class="px-4 py-2 bg-sky-100 text-sky-800 font-medium rounded-md shadow-sm hover:bg-sky-200 transition">
          Cambiar Año ({{ selectedYear }})
        </button>
      </div>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <button *ngFor="let month of months; let i = index" (click)="selectMonth(i)"
          [class.bg-sky-500]="i === selectedMonth" [class.text-white]="i === selectedMonth"
          class="p-2 rounded-lg bg-gray-100 hover:bg-sky-500 hover:text-white text-gray-800 transition-all duration-300 animate-fadeSlideUp">
          {{ month }}
        </button>
      </div>
    </div>

    <!-- ❌ Cerrar -->
    <div class="mt-4 flex justify-end">
      <button (click)="closeMonthModal()"
        class="bg-red-500 text-white px-4 py-2 rounded-lg shadow hover:bg-red-600 transition-all duration-300">
        Cerrar
      </button>
    </div>
</app-modal-shell>
