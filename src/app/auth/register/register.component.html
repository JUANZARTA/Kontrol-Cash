<div class="min-h-screen flex items-center justify-center relative overflow-hidden bg-white px-4">

  <!-- Fondo animado -->
  <span class="absolute top-[10px] right-[-100px] w-72 h-72 rounded-full bg-sky-100 animate-floating-slow"></span>
  <span class="absolute top-[150px] right-[-150px] w-5 h-5 rounded-full bg-pink-100 animate-floating"></span>
  <span class="absolute bottom-[150px] left-[-150px] w-5 h-5 rounded-full bg-purple-100 animate-floating-fast"></span>
  <span
    class="absolute bottom-[10px] left-[-100px] w-72 h-72 rounded-full bg-yellow-100 animate-floating-slower"></span>
  <span class="circle" style="top:10%; left:20%; animation-delay:0s;"></span>
  <span class="circle" style="top:50%; left:70%; animation-delay:1s;"></span>
  <span class="circle" style="top:80%; left:40%; animation-delay:2s;"></span>

  <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-10 relative z-10">

    <h2 class="text-center text-3xl font-bold text-gray-700 mb-6">Crear Cuenta</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- Nombre -->
      <div class="mb-6">
        <label for="name" class="block text-gray-600 text-sm font-semibold">Nombre</label>
        <input type="text" id="name" formControlName="name"
          class="w-full px-4 py-3 mt-2 border rounded-lg focus:ring focus:ring-green-300"
          [ngClass]="{'border-red-500': isInvalid('name')}">
        <p *ngIf="isInvalid('name')" class="text-red-500 text-xs mt-1">Debe tener al menos 3 caracteres.</p>
      </div>

      <!-- Email -->
      <div class="mb-6">
        <label for="email" class="block text-gray-600 text-sm font-semibold">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email"
          class="w-full px-4 py-3 mt-2 border rounded-lg focus:ring focus:ring-green-300"
          [ngClass]="{'border-red-500': isInvalid('email')}">
        <p *ngIf="isInvalid('email')" class="text-red-500 text-xs mt-1">Correo inválido.</p>
      </div>

      <!-- Contraseña -->
      <div class="mb-6 relative">
        <label for="password" class="block text-gray-600 text-sm font-semibold">Contraseña</label>
        <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
          class="w-full px-4 py-3 mt-2 border rounded-lg focus:ring focus:ring-green-300 pr-10"
          [ngClass]="{'border-red-500': isInvalid('password')}">
        <button type="button" (click)="togglePasswordVisibility()"
          class="absolute right-3 top-10 text-gray-500 focus:outline-none">
          {{ showPassword ? '🙈' : '👁️' }}
        </button>
        <p *ngIf="isInvalid('password')" class="text-red-500 text-xs mt-1">Debe tener al menos 6 caracteres.</p>
      </div>

      <!-- Confirmar Contraseña -->
      <div class="mb-6">
        <label for="confirmPassword" class="block text-gray-600 text-sm font-semibold">Confirmar Contraseña</label>
        <input [type]="showPassword ? 'text' : 'password'" id="confirmPassword" formControlName="confirmPassword"
          class="w-full px-4 py-3 mt-2 border rounded-lg focus:ring focus:ring-green-300"
          [ngClass]="{'border-red-500': isInvalid('confirmPassword') || registerForm.hasError('mismatch')}">
        <p *ngIf="registerForm.hasError('mismatch')" class="text-red-500 text-xs mt-1">Las contraseñas no coinciden.</p>
      </div>

      <!-- Botón de Registro -->
      <button type="submit" [disabled]="registerForm.invalid"
        class="w-full bg-green-600 text-white py-3 rounded-lg shadow-md hover:bg-green-700 transition disabled:opacity-50">
        Registrarse
      </button>

      <!-- Registro con Google -->
      <button type="button" (click)="onRegisterWithGoogle()"
        class="w-full flex items-center justify-center gap-3 border border-gray-300 py-3 rounded-lg bg-white hover:bg-gray-100 transition mt-4">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" class="w-6 h-6">
        <span class="font-medium text-gray-700">Registrarse con Google</span>
      </button>

      <!-- Enlace a Iniciar Sesión -->
      <p class="text-center text-sm text-gray-500 mt-6">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="text-blue-500 font-semibold hover:underline">Inicia sesión</a>
      </p>

    </form>
  </div>

  <!-- ❌ MODAL DE ERROR -->
  <app-modal-shell *ngIf="showModal" title="Error al Registrar"
    panelClass="max-w-sm w-full relative animate-pop-in" [centered]="true">
      <div class="flex justify-center mb-4">
        <div class="w-16 h-16 flex items-center justify-center bg-red-100 rounded-full">
          <span class="material-icons text-red-500 text-4xl">report_problem</span>
        </div>
      </div>
      <p class="text-gray-600 text-center">{{ errorMessage }}</p>
      <button (click)="closeModal()"
        class="mt-4 w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 transition">
        Cerrar
      </button>
  </app-modal-shell>

  <!-- ✅ MODAL DE ÉXITO MODERNO -->
  <app-modal-shell *ngIf="showSuccessModal"
    panelClass="rounded-3xl max-w-sm w-full p-8 relative flex flex-col items-center justify-center animate-pop-in"
    [centered]="true">
      <!-- Fondo animado dentro del modal -->
      <span
        class="absolute -top-10 -right-10 w-24 h-24 rounded-full bg-green-200 opacity-50 animate-floating-fast"></span>
      <span class="absolute -bottom-10 -left-10 w-24 h-24 rounded-full bg-green-300 opacity-50 animate-floating"></span>

      <!-- Icono de éxito -->
      <div class="flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-6 shadow-md animate-bounce">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-600" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>

      <h3 class="text-2xl font-bold text-gray-800 mb-2 text-center">¡Registro Exitoso!</h3>
      <p class="text-gray-600 text-center mb-4">Redirigiendo al inicio de sesión...</p>

      <button (click)="closeModal()"
        class="mt-2 bg-green-600 text-white font-semibold py-2 px-6 rounded-full hover:bg-green-700 transition shadow-md">
        Continuar
      </button>
  </app-modal-shell>


</div>
