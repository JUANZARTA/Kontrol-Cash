<div class="min-h-screen flex items-center justify-center relative overflow-hidden bg-white px-4">

  <!-- Fondo animado -->
  <span class="absolute top-[-100px] right-[-100px] w-72 h-72 rounded-full bg-sky-100 animate-floating-slow"></span>
  <span class="absolute bottom-[-80px] left-[-120px] w-72 h-72 rounded-full bg-pink-100 animate-floating"></span>
  <span class="absolute top-[150px] left-[-100px] w-24 h-24 rounded-full bg-purple-100 animate-floating-fast"></span>
  <span
    class="absolute bottom-[100px] right-[-60px] w-32 h-32 rounded-full bg-yellow-100 animate-floating-slower"></span>
  <span class="circle" style="top:10%; left:30%; animation-delay:1s;"></span>
  <span class="circle" style="top:50%; left:20%; animation-delay:2s;"></span>
  <span class="circle" style="top:80%; left:80%; animation-delay:0s;"></span>

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-10 relative z-10">

    <!-- Logo -->
    <div class="flex justify-center mb-6">
      <img src="assets/img/logoIcono.png" alt="Logo" class="h-20 w-auto" />
    </div>

    <h2 class="text-center text-2xl font-bold text-gray-800 mb-8">Iniciar Sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Email -->
      <div>
        <label for="email" class="block text-gray-600 font-medium text-sm mb-1">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email"
          class="w-full px-4 py-3 rounded-lg border focus:ring-2 focus:ring-sky-400 outline-none transition"
          [ngClass]="{'border-red-500': isInvalid('email')}">
        <p *ngIf="isInvalid('email')" class="text-red-500 text-xs mt-1">Correo inválido.</p>
      </div>

      <!-- Contraseña -->
      <div class="mb-6 relative">
        <label for="password" class="block text-gray-600 text-sm font-semibold">Contraseña</label>

        <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
          class="w-full px-4 py-3 mt-2 border rounded-lg focus:ring focus:ring-sky-300 pr-10"
          [ngClass]="{'border-red-500': isInvalid('password')}">

        <button type="button" (click)="togglePasswordVisibility()"
          class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 focus:outline-none text-lg">
          <br>{{ showPassword ? '🙈' : '👁️' }}
        </button>

        <p *ngIf="isInvalid('password')" class="text-red-500 text-xs mt-1">Debe tener al menos 6 caracteres.</p>
      </div>

      <!-- Botón de iniciar sesión -->
      <button type="submit" [disabled]="loginForm.invalid"
        class="w-full bg-sky-600 text-white py-3 rounded-xl shadow-lg hover:bg-sky-700 transition disabled:opacity-50">
        Iniciar Sesión
      </button>

      <!-- Login con Google -->
      <button type="button" (click)="onLoginWithGoogle()"
        class="w-full flex items-center justify-center gap-3 border border-gray-300 py-3 rounded-xl bg-white hover:bg-gray-100 transition">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" class="w-6 h-6">
        <span class="font-medium text-gray-700">Iniciar sesión con Google</span>
      </button>

      <!-- Enlace a registro -->
      <p class="text-center text-sm text-gray-500 mt-4">
        ¿No tienes cuenta?
        <a routerLink="/register" class="text-sky-600 font-semibold hover:underline">Regístrate</a>
      </p>
    </form>
  </div>

  <!-- 🔹 OVERLAY DE LOGIN -->
  <div *ngIf="showLoginOverlay" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-40 z-50">
    <div class="bg-white rounded-2xl shadow-2xl px-8 py-6 flex flex-col items-center justify-center animate-pop-in">
      <div class="w-16 h-16 mb-4 flex items-center justify-center">
        <!-- Spinner -->
        <svg *ngIf="!loginSuccess && !loginError" class="animate-spin h-10 w-10 text-sky-500"
          xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>

        <!-- Check éxito -->
        <svg *ngIf="loginSuccess" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-500" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>

        <!-- Cross error -->
        <svg *ngIf="loginError" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-red-500" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </div>

      <h3 class="text-lg font-semibold text-gray-800 text-center">
        <ng-container *ngIf="loginSuccess">¡Éxito!</ng-container>
        <ng-container *ngIf="loginError">Usuario o contraseña incorrecta</ng-container>
        <ng-container *ngIf="!loginSuccess && !loginError">Ingresando...</ng-container>
      </h3>
    </div>
  </div>


</div>
